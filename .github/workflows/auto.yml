name: Auto Update Matches

on:
  schedule:
    # প্রতি ১৫ মিনিট পরপর রান হবে
    - cron: '*/15 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন যুক্ত করবে

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Auto Updater"
          git config --global user.email "bot@github.com"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update matches" && git push)
